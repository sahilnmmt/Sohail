name: pricecompare

on:
  push:
    paths: ["pricecompare/**", ".github/workflows/pricecompare.yml"]
  pull_request:
    paths: ["pricecompare/**", ".github/workflows/pricecompare.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pricecompare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pricecompare/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit and API tests
        run: npm test
      - name: Browser test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricecompare-screenshots
          path: pricecompare/test-results/e2e
