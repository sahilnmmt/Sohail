name: web

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Typecheck and build (emulator configuration)
        run: npm run build
      - name: Security rules tests
        run: npm run test:rules
      - name: End-to-end browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-screenshots
          path: web/test-results/e2e

  # Runs only once the repository has a FIREBASE_SERVICE_ACCOUNT secret and the
  # FIREBASE_* variables (see web/README.md). Until then it is skipped.
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
    steps:
      - name: Check deploy settings
        id: ready
        working-directory: .
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$VITE_FIREBASE_PROJECT_ID" ] && [ -n "$VITE_FIREBASE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: add the FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_* variables (web/README.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build for the real project
        if: steps.ready.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
      - name: Deploy website, security rules and indexes
        if: steps.ready.outputs.ok == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy \
            --project "$VITE_FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          echo "::notice::Deployed to https://$VITE_FIREBASE_PROJECT_ID.web.app"
