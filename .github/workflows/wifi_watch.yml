name: wifi_watch

on:
  push:
    paths: ["wifi_watch/**", ".github/workflows/wifi_watch.yml"]
  pull_request:
    paths: ["wifi_watch/**", ".github/workflows/wifi_watch.yml"]
  workflow_dispatch:

# One build at a time per branch, so two runs never make two signing keys.
concurrency:
  group: wifi-watch-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to update the "wifi-watch-latest" pre-release
    defaults:
      run:
        working-directory: wifi_watch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Get packages and analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        run: flutter test -r expanded

      # Every build is signed with one key, kept in the Actions cache, so
      # Android installs a new build over the last ("package conflicts"
      # otherwise). Made on the first run. Not for pull requests, whose code
      # must not see it. Caches unused for 7 days are dropped; the next build
      # then makes a new key and needs one uninstall.
      - name: Keep the signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/wifi-watch-key/release.jks
          key: wifi-watch-signing-key-v2

      - name: Make the signing key if there is none
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/wifi-watch-key
          if [ ! -f ~/wifi-watch-key/release.jks ]; then
            keytool -genkeypair -keystore ~/wifi-watch-key/release.jks -storetype JKS \
              -storepass wifiwatch -keypass wifiwatch -alias wifiwatch \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WiFi Watch"
          fi
          echo "WIFI_WATCH_KEYSTORE=$HOME/wifi-watch-key/release.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/wifi-watch-key/release.jks -storepass wifiwatch | grep -m1 SHA256

      - name: Build release APK
        run: flutter build apk --release --dart-define=BUILD=${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-watch-apk
          path: wifi_watch/build/app/outputs/flutter-apk/app-release.apk

      # One stable link to tap on a phone: the newest APK from a push, as a
      # pre-release. Not for pull requests.
      - name: Publish the "wifi-watch-latest" pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/wifi-watch.apk"
          git tag -f wifi-watch-latest "$GITHUB_SHA"
          git push -f origin refs/tags/wifi-watch-latest
          notes="Latest WiFi Watch build from \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Download wifi-watch.apk on your Android phone and open it to install."
          if gh release view wifi-watch-latest > /dev/null 2>&1; then
            gh release edit wifi-watch-latest --prerelease --notes "$notes"
          else
            gh release create wifi-watch-latest --prerelease --title "WiFi Watch (latest build)" --notes "$notes"
          fi
          gh release upload wifi-watch-latest "$RUNNER_TEMP/wifi-watch.apk" --clobber
