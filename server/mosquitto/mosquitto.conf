# DEVELOPMENT ONLY: anonymous, unencrypted, for a trusted home LAN.
# Before anything leaves your desk, switch to TLS (listener 8883 + certfile/
# keyfile), set allow_anonymous false and add a password_file with one login
# per device. Per-device credentials and topic ACLs are planned for P1.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
